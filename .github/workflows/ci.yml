name: ci

# Runs on every push and pull request. The release workflow deliberately gates
# nothing (RELEASE.md); this is where a change is actually checked.
#
# The Docker-gated tests skip themselves where there is no daemon. Linux runners
# have one, so on Linux they genuinely run — that is why Linux is the job that
# carries the whole suite and the others check that the code builds and the
# platform-independent tests pass.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  # The engine is a git dependency. v0.2.19's ubuntu-24.04-arm launcher died
  # cloning it through cargo's built-in libgit2 ("the SSL certificate is
  # invalid; class=Ssl (16)") after cargo's default three retries, and shipped
  # without an arm64 bundle. The git CLI uses the runner's own TLS stack and CA
  # store; more retries cover the rest of a flaky network.
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_NET_RETRY: "10"

jobs:
  test:
    name: test ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # See release.yml for the measurement. The engine fork's benchmark files
      # push a default-CARGO_HOME checkout past Windows' 260-character limit,
      # and `core.longpaths` does not help because cargo checks out with
      # libgit2. Must precede rust-cache.
      - name: Windows long paths
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git config --global core.longpaths true
          "CARGO_NET_GIT_FETCH_WITH_CLI=true" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CARGO_HOME=C:\cg" | Out-File -FilePath $env:GITHUB_ENV -Append
          "C:\cg\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          New-Item -ItemType Directory -Force -Path C:\cg | Out-Null

      - uses: Swatinem/rust-cache@v2
        with:
          key: ci-${{ matrix.os }}

      # The Linux room-adapter tests (`lan_adapter`, `lan_no_garbage`,
      # `lan_openttd`) re-run themselves in an unprivileged user namespace, which
      # Ubuntu 24.04's AppArmor forbids by default. Without this they skip —
      # and they did, silently, through v0.2.20: "finished in 0.00s".
      - name: Allow unprivileged user namespaces
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # A real OpenTTD server and client in a LAN room (`tests/lan_openttd.rs`).
      # The pinned build is x86_64 Linux only.
      - name: OpenTTD for the real-game LAN test
        if: matrix.os == 'ubuntu-24.04'
        run: |
          scripts/fetch-openttd.sh "$RUNNER_TEMP/openttd"
          echo "OPENTTD_DIR=$RUNNER_TEMP/openttd/openttd-15.3-linux-generic-amd64" >> "$GITHUB_ENV"

      # `launcher/src-tauri` is excluded from the workspace, so this does not
      # build a webview anywhere — that is the `launcher` job's business.
      - name: Test
        if: runner.os != 'Windows'
        run: cargo test --workspace

      # `platform-agent` is a Linux node daemon: it drives a Docker socket and
      # bind-mounts host paths, and its unit tests are written in POSIX paths
      # throughout — `/data/instances/...` compared against joins that use `\`
      # on Windows, and `is_absolute()` fixtures that a drive-letter platform
      # rightly calls relative. Rewriting all of that would be churn in service
      # of a platform the agent is not shipped for.
      #
      # It is still **compiled** here, because it is a workspace member and a
      # break in it is a break — and the crates that genuinely ship on Windows,
      # `game-bridge` and `launcher-core`, are still fully tested.
      - name: Test (Windows — the crates that ship there)
        if: runner.os == 'Windows'
        run: |
          cargo test --workspace --exclude platform-agent
          cargo check -p platform-agent --all-targets

      - name: Clippy
        run: cargo clippy --workspace --all-targets

  # Mode 3 on Windows (PLAN.md §14.3 step 4): a real Wintun adapter, made by the
  # real lan-helper, with a limited broadcast proven to leave through it. Its
  # own job because it needs what the test job must not assume: an
  # administrator (a hosted runner is one), wintun.dll, and a firewall that
  # lets a test's socket be reached on a new adapter.
  lan-windows:
    name: LAN room adapter (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Windows long paths
        shell: pwsh
        run: |
          git config --global core.longpaths true
          "CARGO_NET_GIT_FETCH_WITH_CLI=true" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CARGO_HOME=C:\cg" | Out-File -FilePath $env:GITHUB_ENV -Append
          "C:\cg\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          New-Item -ItemType Directory -Force -Path C:\cg | Out-Null

      - uses: Swatinem/rust-cache@v2
        with:
          key: ci-lan-windows

      # WireGuard's prebuilt, signed wintun.dll, digest-checked by the script.
      - name: Wintun
        shell: pwsh
        run: |
          ./scripts/fetch-wintun.ps1 "$env:RUNNER_TEMP\wintun"
          "GAME_BRIDGE_WINTUN_DLL=$env:RUNNER_TEMP\wintun\wintun.dll" | Out-File -FilePath $env:GITHUB_ENV -Append

      # A new adapter is an "unidentified network", which Windows files under
      # the Public profile and firewalls. On a player's machine the game asks
      # for its own rule; on a throwaway runner, off is the honest equivalent.
      - name: Firewall off (ephemeral runner)
        shell: pwsh
        run: netsh advfirewall set allprofiles state off

      # The Hamachi situation, on purpose. Left alone, Windows' automatic
      # metric already prefers Wintun (it reports a fast link) over the
      # runner's virtual Ethernet, so a limited broadcast went through the room
      # even with the fix removed — measured on a branch with the metric and
      # route deleted, which passed. So the runner's own network is made
      # cheaper than any *automatic* metric (Windows never assigns one below 5)
      # while staying dearer than the room's 1: exactly the claim the fix
      # makes. Pinned to 1 it ties the room's adapter and the tie goes to the
      # real network — measured too, and recorded as the fix's limit.
      - name: Make the runner's own network the cheapest route
        shell: pwsh
        run: |
          Get-NetIPInterface -AddressFamily IPv4 -ConnectionState Connected |
            Where-Object { $_.InterfaceAlias -notlike 'Loopback*' } |
            Set-NetIPInterface -InterfaceMetric 2
          Get-NetIPInterface -AddressFamily IPv4 | Format-Table InterfaceAlias, InterfaceMetric, ConnectionState

      - name: Test
        run: cargo test -p game-bridge --test lan_wintun -- --nocapture

  launcher:
    name: launcher builds ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Windows long paths
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git config --global core.longpaths true
          "CARGO_NET_GIT_FETCH_WITH_CLI=true" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CARGO_HOME=C:\cg" | Out-File -FilePath $env:GITHUB_ENV -Append
          "C:\cg\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          New-Item -ItemType Directory -Force -Path C:\cg | Out-Null

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher/src-tauri
          key: ci-launcher-${{ matrix.os }}

      - name: Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev xvfb

      # The launcher ships lan-helper as a sidecar on Linux and Windows, and
      # wintun.dll beside it on Windows (tauri.linux.conf.json,
      # tauri.windows.conf.json). The shell's build script refuses to start
      # without them, so staging them here is also what proves the bundle
      # config names files that exist.
      - name: Stage the LAN helper
        if: runner.os != 'macOS'
        shell: bash
        run: scripts/stage-lan-helper.sh

      - name: Stage Wintun
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/fetch-wintun.ps1 launcher/src-tauri/binaries

      # Build, not bundle. Bundling is the release's job and needs packaging
      # toolchains; what CI has to catch is a launcher that stopped compiling —
      # which the workspace `cargo test` cannot see, because src-tauri is
      # excluded from it.
      - name: Build the launcher shell
        working-directory: launcher/src-tauri
        run: cargo build

      # Portable mode's promise, checked on the real app: run it with a
      # portable-data folder beside it and fail if it wrote anything outside
      # that folder (PLAN.md §14, step 5b).
      - name: A portable run leaves nothing outside its folder (Linux)
        if: runner.os == 'Linux'
        run: scripts/check-portable.sh launcher/src-tauri/target/debug/launcher

      - name: A portable run leaves nothing outside its folder (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/check-portable.ps1 launcher/src-tauri/target/debug/launcher.exe

  frontend:
    name: frontend render pass
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # A headless DOM pass over launcher/dist with a mocked Tauri bridge. It
      # catches the class of bug the frontend contract actually has: a renamed
      # serde field reads as `undefined` in JavaScript rather than throwing.
      - name: uicheck
        working-directory: launcher/uicheck
        run: |
          npm install
          node render.mjs
