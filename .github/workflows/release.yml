name: release

# Cross-platform artifacts for a tag. This machine builds Linux x86_64; macOS
# and Windows come from runners, because a Tauri app cannot honestly be
# cross-compiled from Linux (macOS needs the Apple SDK, Windows needs MSVC and
# WebView2) — see RELEASE.md.
#
# Nothing here gates a release: the checks that matter need a Docker daemon and
# a second machine on a shared interface, and a green pipeline that skipped them
# would be a worse signal than no pipeline. This job only builds and uploads.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and upload to (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  cli:
    name: cli ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          # Reticulum's natural home includes single-board machines, so an ARM
          # Linux build is not an afterthought here. Native runner rather than
          # cross-compilation: the engine is a real dependency and a
          # cross-linked binary nobody has run is not evidence of anything.
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
          # Intel macOS is **cross-built on an Apple Silicon runner**, which is
          # a different claim from the one the ARM Linux entry above refuses to
          # make. `macos-13` was retired by GitHub, and a job asking for a
          # retired label is not failed — it queues, forever. That is what left
          # every release run since v0.1.0 hanging with one job outstanding,
          # and why no release has ever carried an Intel-mac asset.
          #
          # Cross-compiling here is honest because it is the same OS and the
          # same Apple SDK, which ships both architectures; nothing
          # third-party links this. It is still a binary nobody has run, so it
          # is a CLI target and not the launcher's.
          - os: macos-14
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # See the launcher job's copy of this step for the measurement and why
      # `core.longpaths` alone is not enough. The CLI job has passed on Windows
      # without it, but only because a warm rust-cache already held the engine
      # checkout — a cold run would fail the same way, so it does not get to
      # depend on that.
      - name: Windows long paths
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git config --global core.longpaths true
          "CARGO_NET_GIT_FETCH_WITH_CLI=true" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CARGO_HOME=C:\cg" | Out-File -FilePath $env:GITHUB_ENV -Append
          "C:\cg\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          New-Item -ItemType Directory -Force -Path C:\cg | Out-Null

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # game-bridge, platform-agent, platform-index. The launcher is a separate
      # job because it needs a webview toolchain.
      # `--target` on every entry, native ones included, so the output path is
      # the same shape everywhere and the packaging steps below need no
      # special case for the cross-built one.
      - name: Build
        run: cargo build --release --bins --target ${{ matrix.target }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          name="gaming-platform-prns-${{ matrix.target }}"
          mkdir -p "dist/$name"
          out="target/${{ matrix.target }}/release"
          cp "$out/game-bridge" "$out/platform-agent" "$out/platform-index" "dist/$name/"
          cp -r packs "dist/$name/packs"
          cp README.md RELEASE.md ENGINE.md "dist/$name/"
          tar -czf "dist/$name.tar.gz" -C dist "$name"
          shasum -a 256 "dist/$name.tar.gz" > "dist/$name.tar.gz.sha256"

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "gaming-platform-prns-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path "dist/$name" | Out-Null
          $out = "target/${{ matrix.target }}/release"
          Copy-Item "$out/game-bridge.exe","$out/platform-agent.exe","$out/platform-index.exe" "dist/$name/"
          Copy-Item -Recurse packs "dist/$name/packs"
          Copy-Item README.md,RELEASE.md,ENGINE.md "dist/$name/"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
          (Get-FileHash "dist/$name.zip" -Algorithm SHA256).Hash | Out-File "dist/$name.zip.sha256"

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # The workflow is triggered by a tag, so make the tag enough. It used
          # to only *upload*, which meant a tag with no hand-made Release
          # failed every job with "release not found" — the artifacts were all
          # built and then thrown away. Creating it here is idempotent and
          # races safely: several jobs may try at once and all but one get a
          # harmless "already exists".
          tag="${{ inputs.tag || github.ref_name }}"
          gh release view "$tag" >/dev/null 2>&1 \
            || gh release create "$tag" --title "$tag" --generate-notes \
            || true
          # nullglob, because only one of the two archive shapes exists per OS
          # and bash otherwise hands `gh` the literal pattern.
          shopt -s nullglob
          files=(dist/*.tar.gz dist/*.zip dist/*.sha256)
          gh release upload "$tag" "${files[@]}" --clobber

  launcher:
    name: launcher ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: ubuntu-22.04
          - os: ubuntu-24.04-arm
            label: ubuntu-24.04-arm
          # One macOS bundle, universal, covering Intel and Apple Silicon —
          # rather than the retired `macos-13` runner, which does not fail but
          # queues forever (see the cli job).
          #
          # This replaced a native Apple-Silicon-only entry once the universal
          # build had proven itself on a real release: v0.2.1 and v0.2.2 each
          # published both, and the universal dmg came out at 10.4 MB against
          # the native 5.3 MB. That size is the evidence it is genuinely a fat
          # binary and not a single-arch build wearing the name.
          - os: macos-14
            label: macos-14-universal
            args: "--target universal-apple-darwin"
            rust-targets: "x86_64-apple-darwin,aarch64-apple-darwin"
          - os: windows-latest
            label: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets || '' }}

      # The engine is a git dependency whose tree carries benchmark result files
      # with very long names, and Windows refuses paths over 260 characters:
      #   path too long: '.../benchmark-wire-driver--rns-1.4.0-compiled--benchmark-wire-driver.jsonl'
      #
      # `core.longpaths` alone is not enough, and this is what silently cost the
      # v0.1.0 release its Windows launcher. Cargo *fetches* with the git CLI
      # when told to, but it *checks out* into CARGO_HOME with libgit2, which
      # fails with `class=Filesystem (30)` before any of that applies. So the
      # fix is to make the path shorter than the limit rather than to ask
      # Windows to lift it.
      #
      # The measurement, so a later engine bump has a tripwire rather than a
      # mystery: the longest path inside the fork is 198 characters, and
      # `C:/cg/git/checkouts/prns-<hash>/<rev>/` is 49, for 247 — thirteen
      # characters of headroom under 260. The default CARGO_HOME
      # (`C:/Users/runneradmin/.cargo`) makes the same path 266 and fails.
      #
      # This must run **before** rust-cache, or the cache is restored into the
      # CARGO_HOME this step is about to abandon.
      - name: Windows long paths
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git config --global core.longpaths true
          "CARGO_NET_GIT_FETCH_WITH_CLI=true" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CARGO_HOME=C:\cg" | Out-File -FilePath $env:GITHUB_ENV -Append
          "C:\cg\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          New-Item -ItemType Directory -Force -Path C:\cg | Out-Null

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher/src-tauri
          key: launcher-${{ matrix.label }}

      # WebKitGTK and the AppImage tooling. librsvg2-dev is not optional:
      # without it linuxdeploy's gtk plugin fails after the deb and rpm have
      # already succeeded (RELEASE.md).
      - name: Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev patchelf file rpm

      - name: Install the Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Bundle
        working-directory: launcher/src-tauri
        run: cargo tauri build ${{ matrix.args || '' }}

      # linuxdeploy bundles the build host's libwayland-client.so.0 into the
      # AppImage, and on any machine with the NVIDIA driver that library *is*
      # the crash: v0.2.18 and every AppImage before it segfault before a
      # window is ever drawn, with nothing on stderr but two unrelated GTK
      # module warnings. The core says why:
      #
      #   #0 pthread_mutex_lock            (libc.so.6)
      #   #2 libnvidia-egl-wayland2.so.1
      #   #4 libEGL_nvidia.so.0
      #   #6 libEGL.so.1
      #
      # libEGL is a *host* library — glvnd is not bundleable — so EGL init
      # loads the host's libnvidia-egl-wayland2.so.1, which then calls into
      # the bundled wayland client: 1.20 from ubuntu-22.04 against the 1.26 it
      # was built against. GDK_BACKEND=x11 does not help, because EGL probes
      # every external platform at init regardless of the GDK backend, and
      # neither WEBKIT_DISABLE_DMABUF_RENDERER nor
      # WEBKIT_DISABLE_COMPOSITING_MODE helps either — the crash is below
      # WebKit, in EGL.
      #
      # libwayland-client is a host library by nature: it speaks a protocol to
      # the host's compositor, and the host's copy is always the right one.
      # That is what the AppImage excludelist is for, but linuxdeploy's
      # embedded copy does not carry this entry and Tauri exposes no way to
      # pass `--exclude-library`, so unpack, drop it, repack. Dropping it and
      # nothing else was confirmed against a real NVIDIA machine: restoring
      # any one of the other three bundled wayland libraries kept it alive,
      # restoring this one brought the SIGSEGV straight back.
      - name: Un-bundle libwayland-client from the AppImage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          export APPIMAGE_EXTRACT_AND_RUN=1
          export ARCH="$(uname -m)"

          tool="$RUNNER_TEMP/appimagetool"
          curl -fsSL --retry 3 -o "$tool" \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-$ARCH.AppImage"
          chmod +x "$tool"

          # Absolute paths, because each image is repacked from a scratch
          # directory that `cd` makes the relative ones meaningless from.
          mapfile -d '' images < <(
            find "$PWD/launcher/src-tauri/target" -type f -path '*/bundle/*' \
              -name '*.AppImage' -print0
          )
          if [ ${#images[@]} -eq 0 ]; then
            echo "no AppImage was produced" >&2
            exit 1
          fi

          for img in "${images[@]}"; do
            work="$(mktemp -d)"
            ( cd "$work" && "$img" --appimage-extract >/dev/null )
            lib="$work/squashfs-root/usr/lib/libwayland-client.so.0"
            if [ ! -e "$lib" ]; then
              # Either linuxdeploy stopped bundling it or the excludelist grew
              # the entry. Either way this step is now a no-op, not a failure.
              echo "$(basename "$img"): nothing bundled, left alone"
              rm -rf "$work"
              continue
            fi
            rm -f "$lib" "$img"
            "$tool" --no-appstream "$work/squashfs-root" "$img"
            rm -rf "$work"
            echo "$(basename "$img"): dropped the bundled libwayland-client"
          done

      - name: Collect bundles
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          # A `--target` build lands under target/<triple>/release/bundle, a
          # native one under target/release/bundle. Matching on the path
          # covers both without branching, and without a nested find whose
          # own `{}` would fight this one's.
          find launcher/src-tauri/target -type f -path '*/bundle/*' \
            \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.dmg' -o -name '*.msi' -o -name '*.exe' \) \
            -exec cp {} dist/ \;
          ls -la dist

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # The workflow is triggered by a tag, so make the tag enough. It used
          # to only *upload*, which meant a tag with no hand-made Release
          # failed every job with "release not found" — the artifacts were all
          # built and then thrown away. Creating it here is idempotent and
          # races safely: several jobs may try at once and all but one get a
          # harmless "already exists".
          tag="${{ inputs.tag || github.ref_name }}"
          gh release view "$tag" >/dev/null 2>&1 \
            || gh release create "$tag" --title "$tag" --generate-notes \
            || true
          shopt -s nullglob
          files=(dist/*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no bundles were produced" >&2
            exit 1
          fi
          gh release upload "$tag" "${files[@]}" --clobber
