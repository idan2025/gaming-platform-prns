name: release

# Cross-platform artifacts for a tag. This machine builds Linux x86_64; macOS
# and Windows come from runners, because a Tauri app cannot honestly be
# cross-compiled from Linux (macOS needs the Apple SDK, Windows needs MSVC and
# WebView2) — see RELEASE.md.
#
# Nothing here gates a release: the checks that matter need a Docker daemon and
# a second machine on a shared interface, and a green pipeline that skipped them
# would be a worse signal than no pipeline. This job only builds and uploads.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and upload to (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  cli:
    name: cli ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable

      # See the launcher job's copy of this step for the measurement and why
      # `core.longpaths` alone is not enough. The CLI job has passed on Windows
      # without it, but only because a warm rust-cache already held the engine
      # checkout — a cold run would fail the same way, so it does not get to
      # depend on that.
      - name: Windows long paths
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git config --global core.longpaths true
          "CARGO_NET_GIT_FETCH_WITH_CLI=true" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CARGO_HOME=C:\cg" | Out-File -FilePath $env:GITHUB_ENV -Append
          "C:\cg\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          New-Item -ItemType Directory -Force -Path C:\cg | Out-Null

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # game-bridge, platform-agent, platform-index. The launcher is a separate
      # job because it needs a webview toolchain.
      - name: Build
        run: cargo build --release --bins

      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          name="gaming-platform-prns-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp target/release/game-bridge target/release/platform-agent target/release/platform-index "dist/$name/"
          cp -r packs "dist/$name/packs"
          cp README.md RELEASE.md ENGINE.md "dist/$name/"
          tar -czf "dist/$name.tar.gz" -C dist "$name"
          shasum -a 256 "dist/$name.tar.gz" > "dist/$name.tar.gz.sha256"

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "gaming-platform-prns-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path "dist/$name" | Out-Null
          Copy-Item target/release/game-bridge.exe,target/release/platform-agent.exe,target/release/platform-index.exe "dist/$name/"
          Copy-Item -Recurse packs "dist/$name/packs"
          Copy-Item README.md,RELEASE.md,ENGINE.md "dist/$name/"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
          (Get-FileHash "dist/$name.zip" -Algorithm SHA256).Hash | Out-File "dist/$name.zip.sha256"

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # nullglob, because only one of the two archive shapes exists per OS
          # and bash otherwise hands `gh` the literal pattern.
          shopt -s nullglob
          files=(dist/*.tar.gz dist/*.zip dist/*.sha256)
          gh release upload "${{ inputs.tag || github.ref_name }}" "${files[@]}" --clobber

  launcher:
    name: launcher ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14, macos-13, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable

      # The engine is a git dependency whose tree carries benchmark result files
      # with very long names, and Windows refuses paths over 260 characters:
      #   path too long: '.../benchmark-wire-driver--rns-1.4.0-compiled--benchmark-wire-driver.jsonl'
      #
      # `core.longpaths` alone is not enough, and this is what silently cost the
      # v0.1.0 release its Windows launcher. Cargo *fetches* with the git CLI
      # when told to, but it *checks out* into CARGO_HOME with libgit2, which
      # fails with `class=Filesystem (30)` before any of that applies. So the
      # fix is to make the path shorter than the limit rather than to ask
      # Windows to lift it.
      #
      # The measurement, so a later engine bump has a tripwire rather than a
      # mystery: the longest path inside the fork is 198 characters, and
      # `C:/cg/git/checkouts/prns-<hash>/<rev>/` is 49, for 247 — thirteen
      # characters of headroom under 260. The default CARGO_HOME
      # (`C:/Users/runneradmin/.cargo`) makes the same path 266 and fails.
      #
      # This must run **before** rust-cache, or the cache is restored into the
      # CARGO_HOME this step is about to abandon.
      - name: Windows long paths
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git config --global core.longpaths true
          "CARGO_NET_GIT_FETCH_WITH_CLI=true" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CARGO_HOME=C:\cg" | Out-File -FilePath $env:GITHUB_ENV -Append
          "C:\cg\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          New-Item -ItemType Directory -Force -Path C:\cg | Out-Null

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher/src-tauri
          key: launcher-${{ matrix.os }}

      # WebKitGTK and the AppImage tooling. librsvg2-dev is not optional:
      # without it linuxdeploy's gtk plugin fails after the deb and rpm have
      # already succeeded (RELEASE.md).
      - name: Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev patchelf file rpm

      - name: Install the Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Bundle
        working-directory: launcher/src-tauri
        run: cargo tauri build

      - name: Collect bundles
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          find launcher/src-tauri/target/release/bundle -maxdepth 2 \
            \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.dmg' -o -name '*.msi' -o -name '*.exe' \) \
            -exec cp {} dist/ \;
          ls -la dist

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist/*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no bundles were produced" >&2
            exit 1
          fi
          gh release upload "${{ inputs.tag || github.ref_name }}" "${files[@]}" --clobber
