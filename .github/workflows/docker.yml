name: docker

# Publishes the headless roles as a container image. Not the launcher: that is a
# desktop GUI, and a container cannot start the player's own game (PLAN.md
# §13.5).
#
# This is a convenience for running a node or a relay, never a dependency. The
# zero-infrastructure baseline is two launchers on a shared interface with no
# containers anywhere (DESIGN.md §0).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      # arm64 is emulated here, which is slow but honest: Reticulum runs on
      # single-board machines and an image that only exists for amd64 excludes
      # them.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
