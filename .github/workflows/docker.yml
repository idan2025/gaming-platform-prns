name: docker

# Publishes the headless roles as a container image. Not the launcher: that is a
# desktop GUI, and a container cannot start the player's own game (PLAN.md
# §13.5).
#
# This is a convenience for running a node or a relay, never a dependency. The
# zero-infrastructure baseline is two launchers on a shared interface with no
# containers anywhere (DESIGN.md §0).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # One job per architecture, each on a runner of that architecture. arm64 used
  # to be cross-built under QEMU on an amd64 runner, which works and took 33
  # minutes — compiling Rust through an instruction emulator is as slow as it
  # sounds. Native runners are free for public repositories, so the emulation
  # bought nothing but time.
  #
  # Each job pushes an untagged image by digest; `manifest` below joins them
  # into one multi-arch tag. That is the standard shape for this, and it is what
  # lets the two architectures build at once instead of one after the other.
  build:
    name: image ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runs-on: ubuntu-24.04
          - arch: arm64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          # `name=` is spelled out because this build carries no tags — the
          # manifest job applies those. Without it buildx has nothing to push
          # under and fails with "tag is needed when pushing to registry",
          # which reads like a missing tag but is a missing *name*.
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          # Per-architecture cache keys: one shared key would have each
          # architecture evicting the other's layers every run.
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Export the digest
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          # The `sha256:` prefix is stripped because it is the *filename* here,
          # and `upload-artifact` refuses a colon: "The path for one of the
          # files in artifact is not valid". The manifest job puts the prefix
          # back. The build itself had already pushed by digest when this
          # failed, which is why the error arrived after a successful compile.
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1

  # The tag a person actually pulls. Nothing is tagged until both architectures
  # exist, so `:latest` never briefly means "amd64 only".
  manifest:
    name: manifest
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          merge-multiple: true
          path: /tmp/digests

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Create the multi-arch tag
        working-directory: /tmp/digests
        env:
          # Newline-separated, which is what metadata-action's `tags` output is.
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          # Built with shell rather than jq over DOCKER_METADATA_OUTPUT_JSON:
          # one less tool this step depends on, and `tags` is already the list
          # wanted. Each digest file is named by its bare hex, so the `sha256:`
          # the reference needs is put back here.
          args=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && args+=(-t "$tag")
          done <<< "$TAGS"
          for digest in *; do
            args+=("ghcr.io/${{ github.repository }}@sha256:${digest}")
          done
          echo "docker buildx imagetools create ${args[*]}"
          docker buildx imagetools create "${args[@]}"
