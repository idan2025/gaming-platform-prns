[package]
name = "launcher-core"
version.workspace = true
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Launcher logic for the server browser: sessions, queries, and the shapes the UI consumes. No UI framework."

[dependencies]
game-bridge = { path = "../game-bridge" }
index-client = { path = "../index-client" }
personal-rns = { workspace = true, features = ["tokio-host", "tcp", "udp", "backbone", "wifi-auto", "shared-instance"] }
prns-core = { workspace = true }
anyhow = "1"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"
# Pack repositories (`src/repo.rs`). The same reqwest and rustls-with-ring the
# Tauri updater already brings, so the launcher carries one HTTP stack.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

# Big screen mode's gamepads on Linux (`src/gamepad.rs`), where the webview
# may not read them. Pure Rust; reads /dev/input, never grabs it.
[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.13.2"

# Holding notifications back over a fullscreen game (`src/desktop.rs`). The
# same windows-sys game-bridge already links.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_Shell"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
evdev = "0.13.2"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
serde_json = "1"
tempfile = "3"
