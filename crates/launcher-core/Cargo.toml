[package]
name = "launcher-core"
version.workspace = true
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Launcher logic for the server browser: sessions, queries, and the shapes the UI consumes. No UI framework."

[dependencies]
game-bridge = { path = "../game-bridge" }
index-client = { path = "../index-client" }
personal-rns = { workspace = true, features = ["tokio-host", "tcp", "udp", "backbone", "wifi-auto", "shared-instance"] }
prns-core = { workspace = true }
anyhow = "1"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
serde_json = "1"
tempfile = "3"
