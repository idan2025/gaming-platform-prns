[package]
name = "platform-agent"
version = "0.0.0"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Per-node daemon: runs many game-server instances on one host, sharing one copy of the game content."

[dependencies]
game-bridge = { path = "../game-bridge" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
toml = { version = "0.8", default-features = false, features = ["parse"] }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "sync", "time", "net", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
bollard = "0.17"
axum = "0.7"
serde_json = "1"

[[bin]]
name = "platform-agent"
path = "src/main.rs"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "fs"] }
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
