[package]
name = "platform-agent"
version = "0.0.0"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Per-node daemon: runs many game-server instances on one host, sharing one copy of the game content."

[dependencies]
game-bridge = { path = "../game-bridge" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
toml = { version = "0.8", default-features = false, features = ["parse"] }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "sync", "time", "net", "fs"] }
tracing = "0.1"
bollard = "0.17"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "fs"] }
tempfile = "3"
serde_json = "1"
