[package]
name = "platform-agent"
version.workspace = true
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Per-node daemon: runs many game-server instances on one host, sharing one copy of the game content."

[dependencies]
game-bridge = { path = "../game-bridge" }
platform-auth = { path = "../platform-auth" }
personal-rns = { workspace = true, features = ["tokio-host", "tcp", "udp", "backbone", "wifi-auto", "shared-instance"] }
prns-core = { workspace = true }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
toml = { version = "0.8", default-features = false, features = ["parse"] }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "sync", "time", "net", "fs", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
bollard = "0.17"
futures-util = { version = "0.3", default-features = false }
axum = "0.7"
serde_json = "1"
hex = "0.4"
# A folder repository's path, checked to lie under the data root (`api.rs`).
url = "2"
getrandom = "0.2"
libc = "0.2"
sha2 = "0.10"
# Mojang publishes SHA-1 only for its server jars (`src/minecraft.rs`).
sha1 = "0.10"
# A Minecraft world usually arrives as a zip (`src/world.rs`).
zip = { version = "9", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"
lzma-rs = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
# The node page's accounts: passwords as Argon2id hashes (`src/accounts.rs`).
argon2 = { version = "0.5", features = ["std"] }
# The QR code an authenticator app scans to enrol (`src/accounts.rs`).
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

[[bin]]
name = "platform-agent"
path = "src/main.rs"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "fs"] }
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
