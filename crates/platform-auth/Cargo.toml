[package]
name = "platform-auth"
version.workspace = true
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Challenge/response authentication against a Reticulum identity. One primitive end to end: no passwords, no accounts, no database."

[dependencies]
prns-core = { workspace = true }
serde = { version = "1", features = ["derive"] }
hex = "0.4"
getrandom = "0.2"

[dev-dependencies]
serde_json = "1"
