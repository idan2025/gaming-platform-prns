# Hosted deploy, for an index operator who wants to run servers on other
# people's behalf. Entirely optional: an index with no such file is a directory,
# which is what most of them should be.
#
# Edits to this file take effect within about ten seconds, no restart: add or
# remove a node, a game or a quota by saving it. A save that does not parse is
# logged and changes nothing. Servers on a node you remove keep running; the
# index just stops placing on it and listing it.
#
# THE PLATFORM SHIPS NO LIST OF HOSTABLE GAMES. Which titles you may legally run
# for other people depends on your jurisdiction and on agreements this project
# cannot see (GAMES.md §5, PLAN.md §10). You decide, here — the same way
# platform-agent makes the container image your choice.
#
# An empty `games` list means hosting is off.
games = ["sven-coop"]

# Reach: an agent's HTTP API is loopback-only and refuses to bind anything
# else, because it creates containers and has no authentication. A node on
# another machine is driven over its Reticulum uplink instead (the agent's
# `platform-agent.control` destination as `agent = "<hex>"`, with this
# index's identity in the agent's `trusted_indexes`; see agent.example.toml).
# Do NOT work around that by exposing an agent's HTTP API to the network.
[[nodes]]
name = "local"
api = "http://127.0.0.1:4750"

# A node on another machine, over its uplink:
# [[nodes]]
# name = "eu-1"
# api = "http://127.0.0.1:4750"   # unused while `agent` is set
# agent = "<32 hex chars: the agent's platform-agent.control destination>"
# priority = 10   # filled first; a node with a lower number takes the overflow
#
# Placement: among nodes with room, the highest priority wins, then the most
# free memory, then the most free slots. A node that reports under 1 GiB free
# is full, and a node that does not answer is always last.

[quota]
max_instances_per_account = 3
max_total_instances = 20
idle_timeout_secs = 1800
min_lifetime_secs = 300
create_cooldown_secs = 30
# Remove a stopped server after this many days. Absent keeps it for ever.
# Removes the container only; the server's files stay on the node.
# stopped_delete_after_days = 30

# An account with rules of its own, keyed by its identity hash (32 hex
# characters). Anyone not listed gets the rules above. Every field is optional.
# max_total_instances above still applies to everyone: this reserves room for
# one account, it never makes a full node take another server.
#
# [quota.accounts.b7f20b85976ca7b7b6c56a883992fb9a]
# max_instances = 10
# create_cooldown_secs = 0   # 0 = no cooldown for this account
# never_reap = true          # idle servers of this account are not stopped
