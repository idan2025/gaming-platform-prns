[package]
name = "platform-index"
version = "0.0.0"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Optional announce indexer. A cache of the mesh with a front door, served over HTTP and over Reticulum."

[dependencies]
game-bridge = { path = "../game-bridge" }
platform-agent = { path = "../platform-agent" }
platform-auth = { path = "../platform-auth" }
personal-rns = { workspace = true, features = ["tokio-host", "tcp", "wifi-auto"] }
prns-core = { workspace = true }
anyhow = "1"
axum = "0.7"
hex = "0.4"
getrandom = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
toml = { version = "0.8", default-features = false, features = ["parse"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[[bin]]
name = "platform-index"
path = "src/main.rs"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
tempfile = "3"
