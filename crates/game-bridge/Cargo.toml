[package]
name = "game-bridge"
version.workspace = true
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Game-agnostic Reticulum bridge. Generalizes the Sven Co-op bridge in idan2025/Svencoop-Prns."

[dependencies]
personal-rns = { workspace = true, features = ["tokio-host", "tcp", "udp", "wifi-auto", "shared-instance"] }
prns-core = { workspace = true }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
anyhow = "1"
hex = "0.4"
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
toml = { version = "0.8", default-features = false, features = ["parse"] }
# For the `game-bridge` binary's logging only. The library never installs a
# subscriber — a launcher that links this crate owns that decision.
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[features]
default = ["serde"]
serde = []

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }

[[bin]]
name = "game-bridge"
path = "src/main.rs"
