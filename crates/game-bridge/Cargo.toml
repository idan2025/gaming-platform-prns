[package]
name = "game-bridge"
version.workspace = true
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Game-agnostic Reticulum bridge. Generalizes the Sven Co-op bridge in idan2025/Svencoop-Prns."

[dependencies]
personal-rns = { workspace = true, features = ["tokio-host", "tcp", "udp", "backbone", "wifi-auto", "shared-instance"] }
prns-core = { workspace = true }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal"] }
anyhow = "1"
hex = "0.4"
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "0.8", default-features = false, features = ["parse"] }
# A pack repository's digests (`src/repo.rs`).
sha2 = "0.10"
# Fetching a pack repository and mirroring it (`src/repo.rs`): the same
# reqwest and rustls-with-ring the launcher's updater brings, so there is one
# HTTP stack (`CLAUDE.md`). `url` turns a local folder into a `file://` source.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
url = "2"
# The one-time token a LAN helper proves itself with (`lan_relay.rs`).
getrandom = "0.2"
# For the `game-bridge` binary's logging only. The library never installs a
# subscriber — a launcher that links this crate owns that decision.
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Android has no system root store reqwest can reach without the JVM, so an
# Android build carries Mozilla's roots instead (`repo::http_client`).
[target.'cfg(target_os = "android")'.dependencies]
webpki-root-certs = "1"

# The Mode 3 adapter (`src/lan_adapter.rs`) is TUN ioctls, Linux only.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

# The Mode 3 adapter on Windows: Wintun, loaded at runtime, and the IP Helper
# calls that configure it (`src/lan_adapter/windows.rs`).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[features]
default = ["serde"]
serde = []

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }

[[bin]]
name = "game-bridge"
path = "src/main.rs"

# Mode 3's privileged half (`PLAN.md` §14.1): creates and removes a room
# adapter, nothing else. The launcher never runs elevated.
[[bin]]
name = "lan-helper"
path = "src/bin/lan_helper.rs"
