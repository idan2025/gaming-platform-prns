<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="bg" cx="512" cy="540" r="620" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0d2a1c"/>
      <stop offset="1" stop-color="#070b0a"/>
    </radialGradient>
    <radialGradient id="glow" cx="512" cy="540" r="380" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3dff9a" stop-opacity="0.5"/>
      <stop offset="0.6" stop-color="#14d977" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#14d977" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7dffbe"/>
      <stop offset="1" stop-color="#10b862"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b9c3c0"/>
      <stop offset="0.5" stop-color="#eef3f1"/>
      <stop offset="1" stop-color="#aab4b1"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" rx="228" fill="url(#bg)"/>
  <circle cx="512" cy="540" r="380" fill="url(#glow)"/>

  <!-- The Reticulum ring: a heavy ring and a fine one inside it. -->
  <circle cx="512" cy="540" r="352" fill="none" stroke="#3dff9a" stroke-opacity="0.85" stroke-width="20"/>
  <circle cx="512" cy="540" r="326" fill="none" stroke="#3dff9a" stroke-opacity="0.4" stroke-width="6"/>

  <!-- The mesh: the lantern's light reaches out as links between nodes, and
       one node breaks out of the ring, as in Reticulum's own mark. -->
  <g stroke="#9dffcd" stroke-width="10" stroke-linecap="round" fill="none">
    <path d="M512 560 L862 470"/>
    <path d="M512 560 L176 806"/>
    <path d="M176 806 L392 846 L520 884 L640 836 L862 470"/>
    <path d="M226 336 L300 262 L262 176"/>
    <path d="M300 262 L380 330"/>
  </g>
  <g fill="#3dff9a" stroke="#06150d" stroke-width="10">
    <circle cx="862" cy="470" r="34"/>
    <circle cx="176" cy="806" r="38"/>
    <circle cx="392" cy="846" r="22"/>
    <circle cx="520" cy="884" r="30"/>
    <circle cx="640" cy="836" r="20"/>
    <circle cx="226" cy="336" r="20"/>
    <circle cx="300" cy="262" r="16"/>
    <circle cx="262" cy="176" r="13"/>
  </g>

  <!-- The lantern. Its flame is the mesh's central node. -->
  <path d="M422 282 A90 90 0 0 1 602 282" fill="none" stroke="url(#metal)" stroke-width="34" stroke-linecap="round"/>
  <path d="M412 278 H612 L662 352 H362 Z" fill="url(#metal)"/>
  <rect x="388" y="352" width="248" height="350" rx="40" fill="url(#glass)"/>
  <circle cx="512" cy="552" r="74" fill="#ffffff" opacity="0.55" filter="url(#soft)"/>
  <path d="M512 428 C562 494 570 532 570 562 A58 58 0 0 1 454 562 C454 532 462 494 512 428 Z" fill="#effff6"/>
  <circle cx="512" cy="566" r="22" fill="#10b862"/>
  <rect x="388" y="352" width="248" height="350" rx="40" fill="none" stroke="url(#metal)" stroke-width="28"/>
  <path d="M470 366 V688 M554 366 V688" stroke="#eef3f1" stroke-opacity="0.3" stroke-width="12"/>
  <rect x="344" y="696" width="336" height="58" rx="20" fill="url(#metal)"/>
</svg>
