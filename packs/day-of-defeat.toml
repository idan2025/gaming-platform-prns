# Game pack #9, sibling of counter-strike-16.toml and condition-zero.toml.
#
# Day of Defeat is the same steamcmd app as Half-Life and Counter-Strike 1.6
# (90), and a *different set of depots* inside it: a default `app_update 90`
# installs only the `valve` and `cstrike` directories, and it takes
# `+app_set_config 90 mod dod` before `app_update` to add `dod`. That is why
# the `[content]` block below carries a mod name — see
# crates/game-bridge/src/content.rs, which validates it as an identifier
# because it becomes an argument in a command the node runs.
#
# Verified 2026-09-30 on this node: booted with `HLDS_MOD` set, the server
# logged `Connection to Steam servers successful.` and `VAC secure mode is
# activated.`, and answered an A2S_INFO query on its game port reporting
# app id 30; its A2S game description is `Day of Defeat`.
#
# `app_name` is a wire contract. Freeze it now: every server announcing under
# it becomes undiscoverable if it changes.

schema_version = 1

id = "day-of-defeat"
display_name = "Day of Defeat"
app_name = "day-of-defeat"
default_port = 27015
transport = "udp"
min_link_class = 1
query = "a2s"

# Where this game's maps live, relative to its install directory, so a node can
# offer them as a list instead of asking someone to remember a name.
maps_dir = "dod/maps"

# Which console a node may talk to this game's running server through, so an
# operator can change the map without restarting it and dropping everyone.
# `goldsrc` selects words the build already carries
# (crates/game-bridge/src/console.rs); the pack does not and cannot write the
# command. A pack that could write a console line could type anything at a
# dedicated server's console on somebody else's node.
console = "goldsrc"

# GoldSrc, one UDP port, A2S on that same port, tier 1 (`GAMES.md` §4) — same
# engine family as Counter-Strike 1.6.
#
# `dod/maps` is deliberately NOT writable: the install ships 22 maps in it,
# and a writable path is an empty directory mounted *over* the content, which
# would hide every one of them — `dod_avalanche` included, which is the map
# the server starts on. No `logs` directory ships in `dod`; the agent creates
# the mountpoint at install time.
writable_paths = ["dod/logs"]

notes = "GoldSrc. steamcmd app 90 with mod dod. The operator must set HLDS_MOD = \"dod\" in the node's [games.day-of-defeat].env."

# Every key below belongs to the [content] table, so top-level fields come
# first — TOML has no way back out of a table.
#
# steamcmd app 90 is the Half-Life Dedicated Server, and it fetches
# anonymously — the condition `GAMES.md` §5 puts on unattended content. The
# mod directory is a runtime argument for the image (`HLDS_MOD`, operator
# config), but the *content* for this mod is a separate set of depots, so
# the pack names it. Verified 2026-09-30 on this node:
# `+app_set_config 90 mod dod` before `app_update` ended
# `Success! App '90' fully installed.` and produced the `dod` directory;
# the whole install is 1.3 GB.
[content]
driver = "steamcmd"
app_id = 90
mod = "dod"

# How a launcher starts the player's own copy and points it at a server
# (PLAN.md §13.1). No executable, no path, no command: the program comes from
# the player's own Day of Defeat installation, and `steam_app_id` only helps
# the launcher find it in a Steam library they already have. 30 is from
# Steam's store API (store.steampowered.com/api/appdetails) and matches the
# `steam_appid.txt` the mod itself ships.
[launch]
kind = "goldsrc"
steam_app_id = 30
args = ["+connect {address}", "+password {password}"]
