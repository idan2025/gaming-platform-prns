# Game pack #7, the second with a `[lan]` block and the first commercial,
# Windows-only one: Need for Speed: Underground 2 (EA, 2004). Its online
# service is long gone; its LAN mode never needed one, and a Mode 3 room is a
# LAN (`PLAN.md` §14).
#
# There is no dedicated server to host and no address to type — a player hosts
# a LAN race from inside the game and the others find it in the game's own LAN
# list. So this pack is for rooms: `default_port`/`transport` below are the
# in-game host's listener, there because every pack has one, and nothing
# announces an NFSU2 server as Mode 1.
#
# `app_name` is a wire contract. Freeze it now: every room announcing under it
# becomes undiscoverable if it changes.

schema_version = 1

id = "nfs-underground-2"
display_name = "Need for Speed: Underground 2"
app_name = "nfs-underground-2"
default_port = 9900
transport = "tcp"
# Tier 1 by design, not by measurement: the game shipped for 2004 broadband.
# Nobody has measured it through a room yet; `PLAN.md` §14.3 step 6 does.
min_link_class = 1
notes = "Windows, EA 2004. No dedicated server: host a LAN race in the game and the others pick it from the game's LAN list. Discovery is a UDP 9999 broadcast; play is TCP 9900 to the host, TCP 3282/3284/3285 back to each client, and UDP 3658/3659 both ways. Run the launcher's room check before starting the game."

# The PC box art, as English Wikipedia shows it. Not on Steam, so no header there.
art = "https://upload.wikimedia.org/wikipedia/en/1/10/Nfsu2-win-cover.jpg"

# NFSU2's LAN, from people who carried it across subnets before rooms existed
# (nfsu2relay, abatis.org.uk/nfsu2relay.html, 2004–2005 — captures, since the
# game has no source):
# - Discovery: client *and* host broadcast 384 bytes from UDP 9999 to
#   255.255.255.255:9999 — the limited broadcast, which is the one Windows
#   sends out of a single adapter (`PLAN.md` §14.2). The receiver answers the
#   sender's source address directly; it reads the address off the packet,
#   which is why a room, which delivers every packet with the sender's own room
#   address, is enough.
# - Play: the host listens on TCP 9900 (`PORT=9900` in the game's own
#   `server.cfg`, as the NFSLAN launcher documents); the host connects *back*
#   to each client on TCP 3282, 3284 and 3285; UDP 3658 and 3659 are symmetric
#   between them.
# Every one of these is inbound somewhere — the client ports on clients, the
# server port on the host — so all of them are declared, on every member.
#
# The nfsu2relay author saw one race use 3282 and another warn that it could
# not test connection quality, and guessed "more ports would seem to be
# necessary". If a race in a room warns the same way, that is the first thing
# to capture; switching to `inbound = "any"` is the diagnostic, not the fix.

[lan]
ports = [
    { port = 9999, transport = "udp" },
    { port = 3658, transport = "udp" },
    { port = 3659, transport = "udp" },
    { port = 9900, transport = "tcp" },
    { port = 3282, transport = "tcp" },
    { port = 3284, transport = "tcp" },
    { port = 3285, transport = "tcp" },
]
# `tests/lan_pack_ports.rs` carries every one of these ports, the game's own
# broadcast shape and a room check through real adapters in network
# namespaces — with stand-in sockets, not the game, which does not run on this
# project's CI. False until two people have raced in a room.
tested = false
