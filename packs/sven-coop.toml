# Game pack #1. See crates/game-bridge/src/pack.rs for what a pack may and may
# not contain — in particular, a pack describes a game, it never launches one.
#
# `app_name` is a wire contract frozen by PLAN.md §5: deployed svencoop-prns
# v0.1.10 servers announce under it, and changing it orphans every one of them.

schema_version = 1

id = "sven-coop"
display_name = "Sven Co-op"
app_name = "sven-coop"
default_port = 27015
transport = "udp"
min_link_class = 1
query = "a2s"

# Paths Sven Co-op writes to, relative to its install directory. A node shares
# one read-only copy of the 2.74 GB content across every instance and gives each
# one writable space only here. Validated as relative paths before they become
# mounts — a pack cannot point these at the host.
writable_paths = ["svencoop/maps", "svencoop/logs", "svencoop/scripts"]

notes = "GoldSrc. app_name is frozen by PLAN.md §5: deployed svencoop-prns v0.1.10 servers announce under it."
