# Game pack #1. See crates/game-bridge/src/pack.rs for what a pack may and may
# not contain — in particular, a pack describes a game, it never launches one.
#
# `app_name` is a wire contract frozen by PLAN.md §5: deployed svencoop-prns
# v0.1.10 servers announce under it, and changing it orphans every one of them.

schema_version = 1

id = "sven-coop"
display_name = "Sven Co-op"
app_name = "sven-coop"
default_port = 27015
transport = "udp"
min_link_class = 1
query = "a2s"

# Paths Sven Co-op writes to, relative to its install directory. A node shares
# one read-only copy of the 2.74 GB content across every instance and gives each
# one writable space only here. Validated as relative paths before they become
# mounts — a pack cannot point these at the host.
#
# **A writable path HIDES whatever the install shipped at that path.** It is an
# empty per-instance directory bind-mounted over the content, so listing one
# that already has files in it does not add write access to them — it makes them
# vanish. This pack listed `svencoop/maps` and `svencoop/scripts` until
# 2026-08-31, which mounted empty directories over 108 shipped maps and the
# game's own scripts: the server started, then answered `map change failed:
# 'svencoop1' not found on server` for a map sitting on disk the whole time.
#
# So list only what the server genuinely writes and the install does not ship.
# A dedicated server writes its log; it reads maps and scripts.
writable_paths = ["svencoop/logs"]

notes = "GoldSrc. app_name is frozen by PLAN.md §5: deployed svencoop-prns v0.1.10 servers announce under it."

# steamcmd app 276060 is the Sven Co-op Dedicated Server and it fetches
# anonymously — the condition GAMES.md §5 puts on unattended content. The
# reference implementation has always done exactly this:
# `+login anonymous +app_update 276060 validate +quit` (svencoop-prns run.sh:177).
#
# This pack said `manual` until 2026-08-31, which was simply wrong: PLAN.md
# §11.2 uses 276060 as its own steamcmd *example*, so the doc knew even while
# the pack did not. 276060 is the dedicated server; 225840 is the game a player
# owns, and they are not interchangeable.
#
# One thing steamcmd cannot fix: the DS has builds for Windows and Linux only,
# with no native macOS dedicated server. That is the runtime's problem, not the
# content driver's — a node picks the image, and a macOS node simply cannot host
# this game.
[content]
driver = "steamcmd"
app_id = 276060

# How a launcher starts the player's own copy and points it at a server
# (PLAN.md §13.1). Note what is NOT here: no executable, no path, no command.
# The program comes from the player's own Sven Co-op installation; `steam_app_id`
# only helps the launcher find it in a Steam library the player already has.
#
# `args` is a template over a fixed vocabulary — address, port, password, name —
# substituted into an argument vector that is spawned directly. Nothing is ever
# passed to a shell, which is what makes characters like `;` and `$()` inert
# text rather than syntax. A node never reads this block.
[launch]
kind = "goldsrc"
steam_app_id = 225840
args = ["+connect {address}", "+password {password}"]
