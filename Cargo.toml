[workspace]
resolver = "2"
members = ["crates/game-bridge", "crates/launcher-core", "crates/platform-agent", "crates/platform-auth", "crates/platform-index"]
# The Tauri shell is its own workspace: `launcher/src-tauri` needs a build
# script and platform toolchains that have no business gating `cargo test` here.
exclude = ["launcher/src-tauri"]

[workspace.package]
# One version for every platform crate: they ship together and a mesh peer's
# useful question is "which release is that", not "which crate".
version = "0.2.0"
edition = "2021"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
repository = "https://github.com/idan2025/gaming-platform-prns"

# Engine dependency. See PLAN.md §7 for the decision and ENGINE.md for what the
# pinned rev contains and how to move it. Do not switch these to crates.io: the
# published personal-rns 0.3.7 does not carry the two patches the platform needs
# (ENGINE.md "What the fork adds").
[workspace.dependencies]
personal-rns = { git = "https://github.com/idan2025/Prns.git", rev = "33f0a8391bd0a07888e44207ec87f07fbe2b132b" }
prns-core = { git = "https://github.com/idan2025/Prns.git", rev = "33f0a8391bd0a07888e44207ec87f07fbe2b132b" }

[profile.release]
codegen-units = 1
lto = "fat"
